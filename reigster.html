<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoPay Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        * {
            font-family: 'Sora', sans-serif;
        }

        body {

            background-image:
                linear-gradient(rgba(60, 0, 0, .72), rgba(60, 0, 0, .72)),
                url("images/bg.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

            overflow-x: hidden;

            overflow-y: auto;

            min-height: 100vh;

        }

        /* Floating Bubbles */

        .bubble {

            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(10px);
            animation: float 12s linear infinite;

        }

        .bubble:nth-child(1) {

            width: 260px;
            height: 260px;
            left: -80px;
            top: -80px;

        }

        .bubble:nth-child(2) {

            width: 170px;
            height: 170px;
            right: 8%;
            top: 10%;

            animation-duration: 18s;

        }

        .bubble:nth-child(3) {

            width: 320px;
            height: 320px;
            bottom: -130px;
            right: -120px;

            animation-duration: 20s;

        }

        .bubble:nth-child(4) {

            width: 120px;
            height: 120px;
            bottom: 18%;
            left: 8%;

            animation-duration: 15s;

        }

        .bubble:nth-child(5) {

            width: 70px;
            height: 70px;
            left: 50%;
            top: 12%;

            animation-duration: 10s;

        }

        @keyframes float {

            0% {

                transform: translateY(0px);

            }

            50% {

                transform: translateY(-25px);

            }

            100% {

                transform: translateY(0px);

            }

        }

        .glass {

            background: rgba(255, 255, 255, .12);

            backdrop-filter: blur(25px);

            border: 1px solid rgba(255, 255, 255, .15);

            box-shadow: 0 25px 60px rgba(0, 0, 0, .25);

        }

        input::placeholder {

            color: #d9d9d9;

        }


        #bubbles {

            position: fixed;

            inset: 0;

            overflow: hidden;

            z-index: 0;

            pointer-events: none;

        }

        .bubble {

            position: absolute;

            bottom: -150px;

            border-radius: 50%;

            background: rgba(255, 255, 255, .08);

            backdrop-filter: blur(8px);

            animation: rise linear infinite;

        }

        @keyframes rise {

            0% {

                transform: translateY(0) scale(.3);

                opacity: 0;

            }

            20% {

                opacity: 1;

            }

            100% {

                transform: translateY(-120vh) scale(1.4);

                opacity: 0;

            }

        }
    </style>

</head>

<body>

    <div id="bubbles"></div>

    <div class="min-h-screen flex items-center justify-center px-6 py-20">

        <div class="glass rounded-[35px] w-full max-w-lg p-10 relative z-10">

            <div class="text-center">

                <div
                    class="w-20 h-20 rounded-full bg-gradient-to-r from-yellow-400 to-yellow-500 mx-auto flex items-center justify-center shadow-xl">

                    <img src="/logo.jpg" alt="">

                </div>

                <h1 class="text-4xl font-bold text-white mt-6">

                    Create Account

                </h1>

                <p class="text-white/70 mt-3">

                    Join NeoPay and start earning today.

                </p>

            </div>

            <form id="registerForm" class="mt-10 space-y-6">

                <!-- Full Name -->

                <div>

                    <label class="text-white font-medium block mb-2">

                        Full Name

                    </label>

                    <div class="relative">

                        <i class='bx bx-user absolute left-5 top-1/2 -translate-y-1/2 text-yellow-400 text-xl'></i>

                        <input id="fullname" type="text" required placeholder="Enter your full name"
                            class="w-full bg-white/10 border border-white/15 rounded-2xl pl-14 pr-5 py-4 text-white outline-none focus:border-yellow-400 transition">

                    </div>

                </div>

                <!-- Username -->

                <div>

                    <label class="text-white font-medium block mb-2">

                        Username

                    </label>

                    <div class="relative">

                        <i class='bx bx-id-card absolute left-5 top-1/2 -translate-y-1/2 text-yellow-400 text-xl'></i>

                        <input id="username" type="text" required placeholder="Choose a username"
                            class="w-full bg-white/10 border border-white/15 rounded-2xl pl-14 pr-5 py-4 text-white outline-none focus:border-yellow-400 transition">

                    </div>

                </div>

                <!-- Email -->

                <div>

                    <label class="text-white font-medium block mb-2">

                        Email Address

                    </label>

                    <div class="relative">

                        <i class='bx bx-envelope absolute left-5 top-1/2 -translate-y-1/2 text-yellow-400 text-xl'></i>

                        <input id="email" type="email" required placeholder="Enter your email"
                            class="w-full bg-white/10 border border-white/15 rounded-2xl pl-14 pr-5 py-4 text-white outline-none focus:border-yellow-400 transition">

                    </div>

                </div>

                <!-- Phone -->

                <div>

                    <label class="text-white font-medium block mb-2">

                        Phone Number

                    </label>

                    <div class="relative">

                        <i class='bx bx-phone absolute left-5 top-1/2 -translate-y-1/2 text-yellow-400 text-xl'></i>

                        <input id="phone" type="tel" required placeholder="Enter your phone number"
                            class="w-full bg-white/10 border border-white/15 rounded-2xl pl-14 pr-5 py-4 text-white outline-none focus:border-yellow-400 transition">

                    </div>

                </div>


                <!-- Password -->
                <label class="text-white font-medium block mb-2">

                    Password

                </label>

                <div class="relative">

                    <i class='bx bx-lock-alt absolute left-5 top-1/2 -translate-y-1/2 text-yellow-400 text-xl'></i>

                    <input id="password" type="password" required
                        class="w-full bg-white/10 border border-white/15 rounded-2xl pl-14 pr-14 py-4 text-white outline-none"
                        placeholder="Your password">

                    <button type="button" class="absolute right-5 top-1/2 -translate-y-1/2 text-yellow-400">

                        <i class='bx bx-hide text-2xl toggle-password'></i>

                    </button>

                </div>


                <!-- Confirm Password -->

                <div>

                    <label class="text-white font-medium block mb-2">

                        Confirm Password

                    </label>

                    <div class="relative">

                        <i class='bx bx-lock-alt absolute left-5 top-1/2 -translate-y-1/2 text-yellow-400 text-xl'></i>

                        <input type="password" name="confirmPassword" required placeholder="Confirm your password"
                            class="w-full bg-white/10 border border-white/15 rounded-2xl pl-14 pr-14 py-4 text-white outline-none focus:border-yellow-400 transition">

                        <button type="button" class="absolute right-5 top-1/2 -translate-y-1/2 text-yellow-400">

                            <i class='bx bx-hide text-2xl toggle-password'></i>

                        </button>

                    </div>

                </div>


                <button type="submit"
                    class="w-full bg-gradient-to-r from-yellow-400 to-yellow-500 text-red-900 font-bold py-4 rounded-2xl text-lg hover:scale-[1.02] transition shadow-2xl mt-5">

                    Create Account

                </button>


            </form>

        </div>

    </div>






    <script>
        const container = document.getElementById("bubbles");

        function createBubble() {

            const bubble = document.createElement("span");

            bubble.classList.add("bubble");

            const size = Math.random() * 90 + 20;

            bubble.style.width = size + "px";

            bubble.style.height = size + "px";

            bubble.style.left = Math.random() * 100 + "%";

            bubble.style.animationDuration =
                Math.random() * 8 + 10 + "s";

            bubble.style.opacity =
                Math.random() * .5 + .2;

            container.appendChild(bubble);

            setTimeout(() => {

                bubble.remove();

            }, 18000);

        }

        setInterval(createBubble, 350);



        // Show / Hide Password

        document.querySelectorAll(".toggle-password").forEach(function (icon) {

            icon.addEventListener("click", function () {

                // Find the input inside the same parent div
                const input = this.closest(".relative").querySelector("input");

                if (input.type === "password") {

                    input.type = "text";

                    this.classList.remove("bx-hide");
                    this.classList.add("bx-show");

                } else {

                    input.type = "password";

                    this.classList.remove("bx-show");
                    this.classList.add("bx-hide");

                }

            });

        });


        const form = document.getElementById("registerForm");

        form.addEventListener("submit", function (e) {

            e.preventDefault();

            const user = {

                fullname: document.getElementById("fullname").value,

                username: document.getElementById("username").value,

                email: document.getElementById("email").value,

                phone: document.getElementById("phone").value,

                password: document.getElementById("password").value

            };

            localStorage.setItem("loggedInUser", JSON.stringify(user));

            window.location.href = "package.html";

        });
    </script>




</body>

</html>
