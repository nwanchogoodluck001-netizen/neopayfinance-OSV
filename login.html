<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeoPay Finance - Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

<style>

body{
    background:#050505;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:450px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:30px;
    padding:35px;
}

.input-box{
    width:100%;
    padding:15px;
    border-radius:14px;
    background:#111;
    border:1px solid rgba(255,255,255,.1);
    outline:none;
    color:white;
}

.input-box:focus{
    border-color:#FFD700;
}

.login-btn{
    width:100%;
    padding:15px;
    border-radius:14px;
    font-weight:bold;
    background:linear-gradient(
    90deg,
    #c1121f,
    #ff0000,
    #ffb703
    );
}

</style>

</head>

<body>

<div class="card">

    <div class="text-center mb-8">

        <div class="w-20 h-20 mx-auto rounded-2xl bg-red-600 flex items-center justify-center mb-4">
            <i class='bx bx-wallet text-4xl'></i>
        </div>

        <h1 class="text-3xl font-black">
            NeoPay Finance
        </h1>

        <p class="text-gray-400 mt-2">
            Login to your account
        </p>

    </div>

    <form id="loginForm" class="space-y-5">

        <div>

            <label class="block mb-2">
                Email or Phone
            </label>

            <input
            id="loginId"
            type="text"
       
            class="input-box"
            placeholder="Enter email or phone">

        </div>

        <div class="relative">

            <label class="block mb-2">
                Password
            </label>

            <input
            id="password"
            type="password"
       
            class="input-box"
            placeholder="Enter password">

            <i
            onclick="togglePassword()"
            class='bx bx-show absolute right-4 top-[52px] cursor-pointer text-xl'>
            </i>

        </div>

      

    </form>

      <a href="/dashboard.html">
        <button type=""class="login-btn mt-5">Login</button>
        </a>

    <div class="text-center mt-6">

        Don't have an account?

        <a
        href="/reigster.html"
        class="text-yellow-400">

            Register

        </a>

    </div>

</div>

</body>
</html>
